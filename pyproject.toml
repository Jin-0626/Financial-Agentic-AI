[project]
name = "malaysia-financial-research-agent"
version = "0.1.0"
description = "LangGraph DeepAgent for Bursa Malaysia Financial Research using Ollama"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.6.0",
    "langgraph>=0.1.0",
    "langchain-community>=0.0.30",
    "langchain-core>=0.1.40",
    "langchain-ollama>=0.2.0",
    "langsmith>=0.1.0",
    "yfinance>=0.2.40",
    "pandas>=2.0.0",
    "plotly>=5.20.0",
    "streamlit>=1.36.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "tavily-python>=0.5.0",
    "pytest>=8.0.0",
    "ruff>=0.8.0",
    "langgraph-cli[inmem]>=0.4.31",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PLC0415", "PLR2004", "TRY003"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["research_agent"]
