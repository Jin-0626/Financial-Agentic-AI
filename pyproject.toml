[project]
name = "financial-research-terminal"
version = "0.1.0"
description = "Tauri financial workspace with a Rust engine and Python research gateway"
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7.19",
    "fastapi>=0.141.1",
    "langchain[mcp]==1.4.3",
    "requests>=2.31.0",
    "langchain-core>=1.5.4",
    "langchain-ollama>=1.1.0",
    "langgraph-checkpoint-postgres>=3.1.2",
    "pandas>=3.0.5",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "uvicorn>=0.53.0",
    "yfinance>=1.7.0",
    "pyjwt[crypto]>=2.10,<3",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".review-tmp", "analytics-runtime/.venv", "frontend", "target"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "UP"]
