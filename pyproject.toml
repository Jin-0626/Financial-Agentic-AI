[project]
name = "bursa-trading-agents"
version = "0.2.0"
description = "Production Multi-Agent Financial Research Desk for Bursa Malaysia"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.2.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "langchain-ollama>=0.1.0",
    "langsmith>=0.1.99",
    "tavily-python>=0.4.0",
    "sqlalchemy[asyncio]>=2.0.32",
    "asyncpg>=0.29.0",
    "pgvector>=0.3.2",
    "pypdf>=5.0.0",
    "yfinance>=0.2.40",
    "ta>=0.11.0",
    "pandas>=2.2.0",
    "httpx>=0.27.0",
    "langgraph-cli[inmem]>=0.4.31"
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.8",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agents*"]
exclude = ["test*", "tests*"]
