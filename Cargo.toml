[workspace]
members = ["crates/*", "frontend/src-tauri"]
# Plain Cargo commands stay usable on headless backend development machines.
# Use --workspace for every package, including the desktop application.
default-members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
publish = false

[workspace.dependencies]
terminal-core = { path = "crates/terminal-core" }
terminal-providers = { path = "crates/terminal-providers" }
terminal-storage = { path = "crates/terminal-storage" }
terminal-engine = { path = "crates/terminal-engine" }
terminal-ui = { path = "crates/terminal-ui" }
tauri = { version = "2.12.1", features = [] }
tauri-build = { version = "2.7.1", features = [] }

serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip", "raw_value"] }
thiserror = "2"
schemars = "1"
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "=1.43.0", features = ["serde-str", "maths"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "time", "process", "signal", "net"] }
tokio-util = { version = "0.7", features = ["rt"] }
polars = { version = "=0.55.2", default-features = false, features = ["lazy", "parquet"] }
sha2 = "0.10"
tempfile = "3"
rand = "0.9"
rand_chacha = "0.9"
statrs = { version = "0.18", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
quick-xml = "0.38"
jsonschema = { version = "0.33", default-features = false }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }

axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
jsonwebtoken = { version = "11.1", default-features = false, features = ["rust_crypto"] }

[workspace.lints.rust]
unsafe_code = "forbid"
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.dev]
debug = 0
[profile.test]
debug = 0
