name: Regression checks
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: 2
  CARGO_TERM_COLOR: always
  PYTHON_DOTENV_DISABLED: "1"
permissions:
  contents: read
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - run: cargo +1.99.0 build --locked --workspace --all-features -j 2
      - run: cargo +1.99.0 test --locked --workspace --all-features -j 2
      - run: cargo +1.99.0 fmt --all --check
      - run: cargo +1.99.0 clippy --locked --workspace --all-targets --all-features -- -D warnings
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
      - run: rustup toolchain install 1.99.0 --profile minimal
      - run: cargo +1.99.0 build --locked -p quant-engine -j 2
      - run: cargo +1.99.0 build --locked -p terminal-server --features portfolio -j 2
      - run: uv sync --frozen
      - run: uvx --from ruff==0.17.0 ruff check .
      - run: uvx --from ruff==0.17.0 ruff format --check .
      - run: uv run --frozen python scripts/setup_analytics.py
      - run: uv run --frozen python -B -m unittest discover -s tests -t . -v
        env:
          RUST_SERVER_TEST_COMMAND: '["target/debug/terminal-server"]'
          ENGINE_TEST_COMMAND: '["target/debug/financial-engine"]'
          PYTHON_DOTENV_DISABLED: '1'
      - run: uv pip check --python .venv/bin/python

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - run: npx --prefix frontend playwright install --with-deps chromium
      - run: npm --prefix frontend test -- --reporter=line,html --output=test-results-development
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-development
      - run: npm --prefix frontend run test:production -- --reporter=line,html --output=test-results-production
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-production
      - name: Retain browser reports and failure artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-results
          path: |
            frontend/playwright-report-development/
            frontend/playwright-report-production/
            frontend/test-results-development/
            frontend/test-results-production/
          if-no-files-found: ignore
          retention-days: 14

  desktop:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - run: cargo +1.99.0 test --manifest-path frontend/src-tauri/Cargo.toml --locked
      - run: cargo +1.99.0 fmt --manifest-path frontend/src-tauri/Cargo.toml --check
      - run: cargo +1.99.0 clippy --manifest-path frontend/src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - name: Build standalone Windows executable
        run: npm --prefix frontend run desktop:build -- --no-bundle --ci -- --locked
        env:
          RUSTUP_TOOLCHAIN: 1.99.0
      - name: Retain standalone Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: financial-terminal-windows-x64
          path: frontend/src-tauri/target/release/financial-terminal-desktop.exe
          if-no-files-found: error
          retention-days: 14
