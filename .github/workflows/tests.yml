name: Regression checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - run: cargo +1.99.0 build --locked -j 2
      - run: cargo +1.99.0 test --locked -j 2
      - run: cargo +1.99.0 fmt --all --check
      - run: cargo +1.99.0 clippy --locked --workspace --all-targets -- -D warnings
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: terminal_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
      - run: rustup toolchain install 1.99.0 --profile minimal
      - run: cargo +1.99.0 build --locked --manifest-path fixtures/trace-context/Cargo.toml
      - run: cargo +1.99.0 build --locked -j 2
      - run: uv sync --frozen
      - run: uv run --frozen python -B -m unittest discover -s tests -v
        env:
          ENGINE_TEST_COMMAND: '["target/debug/financial-engine"]'
          TRACE_FIXTURE_COMMAND: '["fixtures/trace-context/target/debug/trace-context-fixture"]'
          TEST_DB_URL: postgresql://postgres:test@127.0.0.1:5432/terminal_test
          PYTHON_DOTENV_DISABLED: '1'
          OTEL_ENABLED: 'false'
      - run: uv pip check --python .venv/bin/python
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - run: npx --prefix frontend playwright install --with-deps chromium
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run test:production
        env:
          PRODUCTION_TEST_SERVER: '../.venv/bin/python -X utf8 ../tests/production_server.py'
          TEST_DB_URL: postgresql://postgres:test@127.0.0.1:5432/terminal_test
          ENGINE_COMMAND: '["${{ github.workspace }}/target/debug/financial-engine"]'
          PYTHON_DOTENV_DISABLED: '1'
          OTEL_ENABLED: 'false'

  desktop:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - run: cargo +1.99.0 test --manifest-path frontend/src-tauri/Cargo.toml --locked
      - run: cargo +1.99.0 fmt --manifest-path frontend/src-tauri/Cargo.toml --check
      - run: cargo +1.99.0 clippy --manifest-path frontend/src-tauri/Cargo.toml --locked --all-targets -- -D warnings
