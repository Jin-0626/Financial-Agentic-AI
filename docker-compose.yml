# docker-compose.yml
services:
  opensandbox:
    image: ${OPEN_SANDBOX_SERVER_IMAGE:-opensandbox/server:latest}
    ports:
      - "8080:8080"
    environment:
      OPEN_SANDBOX_API_KEY: ${OPEN_SANDBOX_API_KEY:?Set OPEN_SANDBOX_API_KEY in .env}
      OPENSANDBOX_API_KEY: ${OPEN_SANDBOX_API_KEY}
      OPEN_SANDBOX_EXECD_IMAGE: ${OPEN_SANDBOX_EXECD_IMAGE:-opensandbox/execd:v1.0.21}
    working_dir: /opt/opensandbox
    entrypoint: ["python", "-m", "deployment.start_server"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./deployment:/opt/opensandbox/deployment:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"